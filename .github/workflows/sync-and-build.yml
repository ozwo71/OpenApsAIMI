name: Sync, Build & Upload to Nextcloud

on:
  schedule:
    - cron: '0 * * * *' # Stündlich
  workflow_dispatch:        # Manuell

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.sync.outputs.has_changes }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: dev_OAPSAIMI
          fetch-depth: 0

      - name: Sync with Upstream
        id: sync
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git remote add upstream https://github.com/MTR93600/OpenApsAIMI.git
          git fetch upstream
          
          UPSTREAM_COMMIT=$(git rev-parse upstream/dev_OAPSAIMI)
          LOCAL_COMMIT=$(git rev-parse HEAD)
          
          if [ "$UPSTREAM_COMMIT" != "$LOCAL_COMMIT" ]; then
            echo "Updates found. Merging..."
            git merge upstream/dev_OAPSAIMI --allow-unrelated-histories
            git push origin dev_OAPSAIMI
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "No updates found."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

  build-and-upload:
    needs: sync
    if: needs.sync.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest // ubuntu-22.04 wird auch in android-build.yml verwendet
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev_OAPSAIMI

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21' # Java 21 ist laut aaps-ci.yml und android-build.yml erforderlich
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK
        # Nutzt JVM Args aus aaps-ci.yml um OutOfMemory Fehler zu vermeiden
        run: |
          ./gradlew assembleFullRelease -x lint \
          -Dorg.gradle.jvmargs="-Xmx8g -XX:+UseParallelGC -Xss1024m" \
          -Dorg.gradle.workers.max=8

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/full/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        id: rename_apk
        run: |
          SIGNED_FILE="${{ steps.sign_app.outputs.signedReleaseFile }}"
          # Generiert Namen: AAPS_FullRelease_YYYY-MM-DD_HH-MM.apk
          NEW_NAME="AAPS_FullRelease_$(date +'%Y-%m-%d_%H-%M').apk"
          mv "$SIGNED_FILE" "$NEW_NAME"
          echo "apk_path=$NEW_NAME" >> $GITHUB_OUTPUT

      - name: Upload to Nextcloud
        run: |
          echo "Uploading ${{ steps.rename_apk.outputs.apk_path }} to Nextcloud..."
          curl -u "${{ secrets.NEXTCLOUD_USER }}:${{ secrets.NEXTCLOUD_PASSWORD }}" \
          -T "${{ steps.rename_apk.outputs.apk_path }}" \
          "${{ secrets.NEXTCLOUD_URL }}${{ steps.rename_apk.outputs.apk_path }}"
          
          # Status Check
          if [ $? -eq 0 ]; then
            echo "✅ Upload successfully completed."
          else
            echo "❌ Upload failed."
            exit 1
          fi
