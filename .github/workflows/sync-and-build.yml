name: Sync, Build, Release & Upload

on:
  schedule:
    - cron: '0 6,18 * * *' # 06:00 und 18:00 Uhr
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Branch'
        required: true
        default: 'dev_OAPSAIMI'
        type: string

permissions:
  contents: write # WICHTIG: Erlaubt das Erstellen von Releases/Tags
  actions: write  # Für das Löschen alter Runs

env:
  BUILD_BRANCH: ${{ inputs.branch_name || 'dev_OAPSAIMI' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.sync.outputs.has_changes }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: ${{ env.BUILD_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }} # Dein PAT für Git-Operationen

      - name: Sync with Upstream
        id: sync
        run: |
          if [ "${{ env.BUILD_BRANCH }}" != "dev_OAPSAIMI" ]; then
            echo "Custom Branch. Kein Sync."
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git remote add upstream https://github.com/MTR93600/OpenApsAIMI.git
          git fetch upstream
          
          UPSTREAM_COMMIT=$(git rev-parse upstream/dev_OAPSAIMI)
          LOCAL_COMMIT=$(git rev-parse HEAD)
          
          if [ "$UPSTREAM_COMMIT" != "$LOCAL_COMMIT" ]; then
            echo "Updates found. Merging..."
            git merge upstream/dev_OAPSAIMI --allow-unrelated-histories
            git push origin dev_OAPSAIMI
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "No updates."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi
          
  build-release-upload:
    needs: sync
    # Baut wenn: Änderungen da sind ODER manuell gestartet wurde
    if: needs.sync.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BUILD_BRANCH }}
          # submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

#      - name: Cache Gradle packages
#        uses: actions/cache@v3
#        with:
#          path: |
#            ~/.gradle/caches
#            ~/.gradle/wrapper/
#          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
#          restore-keys: |
#            ${{ runner.os }}-gradle-

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > monkeystore.jks
        shell: bash

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew :app:assembleFullRelease
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/monkeystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK & Generate Tag Info
        id: prepare_assets
        run: |
          SRC_FILE="app/build/outputs/apk/full/release/app-full-release.apk"
          # Zeitstempel für Dateiname und Tag
          TIMESTAMP=$(date +'%Y-%m-%d_%H-%M')
          NEW_NAME="AAPS_Release_${TIMESTAMP}.apk"
          TAG_NAME="build-${TIMESTAMP}"
          
          if [ -f "$SRC_FILE" ]; then
            mv "$SRC_FILE" "$NEW_NAME"
            echo "apk_path=$NEW_NAME" >> $GITHUB_OUTPUT
            echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          else
            echo "Fehler: APK wurde nicht erstellt."
            exit 1
          fi

      # 1. Upload zu GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_assets.outputs.tag_name }}
          name: "AAPS Build ${{ steps.prepare_assets.outputs.tag_name }}"
          body: "Automatischer Build vom Branch ${{ env.BUILD_BRANCH }}"
          draft: false
          prerelease: false
          files: ${{ steps.prepare_assets.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Standard Token reicht hier dank 'permissions' oben

      # 2. Upload zu Nextcloud (Optionales Backup)
      - name: Upload to Nextcloud
        continue-on-error: true
        run: |
          FILE="${{ steps.prepare_assets.outputs.apk_path }}"
          URL="${{ secrets.NEXTCLOUD_URL }}$FILE"

          for i in 1 2 3 4 5; do
            echo "Upload-Versuch $i"

            if curl \
              --fail \
              --show-error \
              --retry 3 \
              --retry-all-errors \
              --retry-delay 15 \
              -u "${{ secrets.NEXTCLOUD_USER }}:${{ secrets.NEXTCLOUD_PASSWORD }}" \
              -T "$FILE" "$URL"
            then
              echo "Upload erfolgreich"
              exit 0
            fi

            echo "Warte 60 Sekunden wegen möglichem Nextcloud-Lock..."
            sleep 60
          done
          echo "Upload nach mehreren Versuchen fehlgeschlagen"

  cleanup:
    runs-on: ubuntu-latest
    needs: [sync, build-release-upload]
    if: always() # Läuft auch bei Fehler, um aufzuräumen
    permissions:
      contents: write # WICHTIG: Erlaubt das Löschen von Releases
      actions: write
    steps:
      # 1. Alte Logs löschen
      - name: Delete Old Workflow Runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KEEP=5

          gh run list \
            --limit 100 \
            --json databaseId,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .['"$KEEP"':] | .[].databaseId' \
          | while read RUNID; do
              [ -z "$RUNID" ] && continue

              echo "Deleting workflow run $RUNID"
              gh run delete "$RUNID"
            done

      # 2. Alte Releases (APKs) löschen (NEU)
      - name: Delete Older Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KEEP=5

          gh release list \
            --limit 100 \
            --json tagName,publishedAt \
            --jq 'sort_by(.publishedAt) | reverse | .['"$KEEP"':] | .[].tagName' \
          | while read TAG; do
              [ -z "$TAG" ] && continue

              echo "Deleting release and tag: $TAG"

              gh release delete "$TAG" --yes
              git push origin ":refs/tags/$TAG" || true
            done
