name: Sync, Build & Upload to Nextcloud

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Welcher Branch soll gebaut werden?'
        required: true
        default: 'dev_OAPSAIMI'
        type: string

env:
  BUILD_BRANCH: ${{ inputs.branch_name || 'dev_OAPSAIMI' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.sync.outputs.has_changes }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_BRANCH }}
          fetch-depth: 0
          submodules: recursive # WICHTIG: Submodules laden

      - name: Sync with Upstream
        id: sync
        run: |
          if [ "${{ env.BUILD_BRANCH }}" != "dev_OAPSAIMI" ]; then
            echo "Custom Branch gewählt. Überspringe Sync."
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git remote add upstream https://github.com/MTR93600/OpenApsAIMI.git
          git fetch upstream
          
          UPSTREAM_COMMIT=$(git rev-parse upstream/dev_OAPSAIMI)
          LOCAL_COMMIT=$(git rev-parse HEAD)
          
          if [ "$UPSTREAM_COMMIT" != "$LOCAL_COMMIT" ]; then
            echo "Updates found. Merging..."
            git merge upstream/dev_OAPSAIMI --allow-unrelated-histories
            git push origin dev_OAPSAIMI
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "No updates found."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

  build-and-upload:
    needs: sync
    if: needs.sync.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_BRANCH }}
          submodules: recursive # WICHTIG: Auch hier Submodules laden

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK
        # ÄNDERUNG: -x :plugins:main:verifyFullReleaseResources hinzugefügt
        run: |
          ./gradlew assembleFullRelease \
          -x lint \
          -x :plugins:main:verifyFullReleaseResources \
          -Dorg.gradle.jvmargs="-Xmx8g -XX:+UseParallelGC -Xss1024m" \
          -Dorg.gradle.workers.max=8 \
          -Pandroid.injected.signing.store.file=$(pwd)/keystore.jks \
          -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
          -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
          -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        id: rename_apk
        run: |
          SRC_FILE="app/build/outputs/apk/full/release/app-full-release.apk"
          NEW_NAME="AAPS_FullRelease_$(date +'%Y-%m-%d_%H-%M').apk"
          
          if [ -f "$SRC_FILE" ]; then
            mv "$SRC_FILE" "$NEW_NAME"
            echo "apk_path=$NEW_NAME" >> $GITHUB_OUTPUT
          else
            echo "Fehler: APK wurde nicht erstellt."
            exit 1
          fi

      - name: Upload to Nextcloud
        run: |
          echo "Uploading ${{ steps.rename_apk.outputs.apk_path }}..."
          curl -u "${{ secrets.NEXTCLOUD_USER }}:${{ secrets.NEXTCLOUD_PASSWORD }}" \
          -T "${{ steps.rename_apk.outputs.apk_path }}" \
          "${{ secrets.NEXTCLOUD_URL }}${{ steps.rename_apk.outputs.apk_path }}"
          
          if [ $? -eq 0 ]; then
            echo "✅ Upload successfully completed."
          else
            echo "❌ Upload failed."
            exit 1
          fi
