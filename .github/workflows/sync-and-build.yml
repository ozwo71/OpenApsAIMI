name: Sync, Build, Release & Upload

on:
  schedule:
    - cron: '0 6,18 * * *' # 06:00 und 18:00 UTC (= 07:00/19:00 MEZ, 08:00/20:00 MESZ)
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Branch'
        required: true
        default: 'kmp-aimi-migration-study'
        type: string

permissions:
  contents: write # WICHTIG: Erlaubt das Erstellen von Releases/Tags
  actions: write  # Für das Löschen alter Runs

env:
  BUILD_BRANCH: ${{ inputs.branch_name || 'kmp-aimi-migration-study' }}
  UPSTREAM_REPO: https://github.com/MTR93600/OpenApsAIMI.git

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.sync.outputs.has_changes }}
    steps:
      # Checkout des Default-Branches, damit der Job auch dann läuft,
      # wenn BUILD_BRANCH im Fork noch nicht existiert.
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }} # Dein PAT für Git-Operationen

      - name: Sync with Upstream
        id: sync
        run: |
          BRANCH="${{ env.BUILD_BRANCH }}"

          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git remote add upstream "${{ env.UPSTREAM_REPO }}"
          git fetch upstream

          # Branch gibt es upstream nicht -> eigener Branch, kein Sync
          if ! git ls-remote --exit-code --heads upstream "$BRANCH" > /dev/null; then
            echo "Branch '$BRANCH' existiert upstream nicht. Kein Sync."
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Branch gibt es im Fork noch nicht -> aus Upstream anlegen
          if ! git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            echo "Branch '$BRANCH' fehlt im Fork. Lege ihn aus Upstream an..."
            git checkout -B "$BRANCH" "upstream/$BRANCH"
            git push origin "$BRANCH"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          git checkout -B "$BRANCH" "origin/$BRANCH"

          # Prüft, ob der Upstream-Stand bereits enthalten ist.
          # Robuster als ein reiner SHA-Vergleich, falls der Fork-Branch
          # eigene Commits (z. B. Merge-Commits) enthält.
          if git merge-base --is-ancestor "upstream/$BRANCH" HEAD; then
            echo "No updates."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Updates found. Merging..."
            git merge "upstream/$BRANCH" --no-edit --allow-unrelated-histories
            git push origin "$BRANCH"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

  build-release-upload:
    needs: sync
    # Baut wenn: Änderungen da sind ODER manuell gestartet wurde
    if: needs.sync.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BUILD_BRANCH }}
          # submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > monkeystore.jks
        shell: bash

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew :app:assembleFullRelease
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/monkeystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # Signiert die APK selbst, falls das Build-Skript des Branches
      # keine Signing-Konfiguration enthält (z. B. kmp-aimi-migration-study).
      - name: Sign APK if needed
        id: sign
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          APK_DIR="app/build/outputs/apk"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "Verwende Build-Tools: $BUILD_TOOLS"

          SIGNED_APK=$(find "$APK_DIR" -type f -name '*release.apk' ! -name '*unsigned*' | head -n 1)
          UNSIGNED_APK=$(find "$APK_DIR" -type f -name '*release-unsigned.apk' | head -n 1)

          if [ -n "$SIGNED_APK" ]; then
            echo "Bereits von Gradle signierte APK gefunden: $SIGNED_APK"
            FINAL_APK="$SIGNED_APK"
          elif [ -n "$UNSIGNED_APK" ]; then
            echo "Unsignierte APK gefunden: $UNSIGNED_APK – signiere selbst..."
            ALIGNED_APK="${RUNNER_TEMP}/aligned.apk"
            FINAL_APK="${RUNNER_TEMP}/signed.apk"

            "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED_APK" "$ALIGNED_APK"

            "$BUILD_TOOLS/apksigner" sign \
              --ks monkeystore.jks \
              --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass env:KEY_PASSWORD \
              --out "$FINAL_APK" \
              "$ALIGNED_APK"
          else
            echo "Fehler: Keine Release-APK gefunden."
            find app/build/outputs -type f -name '*.apk' || true
            exit 1
          fi

          # Abbruch, falls die APK nicht gültig signiert ist
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$FINAL_APK"

          echo "apk_file=$FINAL_APK" >> $GITHUB_OUTPUT

      - name: Rename APK & Generate Tag Info
        id: prepare_assets
        run: |
          SRC_FILE="${{ steps.sign.outputs.apk_file }}"
          # Zeitstempel für Dateiname und Tag
          TIMESTAMP=$(date +'%Y-%m-%d_%H-%M')
          NEW_NAME="AAPS_Release_${TIMESTAMP}.apk"
          TAG_NAME="build-${TIMESTAMP}"

          if [ -f "$SRC_FILE" ]; then
            mv "$SRC_FILE" "$NEW_NAME"
            echo "apk_path=$NEW_NAME" >> $GITHUB_OUTPUT
            echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "commit_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          else
            echo "Fehler: Signierte APK nicht gefunden."
            exit 1
          fi

      # 1. Upload zu GitHub Release
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create \
            "${{ steps.prepare_assets.outputs.tag_name }}" \
            "${{ steps.prepare_assets.outputs.apk_path }}" \
            --target "${{ env.BUILD_BRANCH }}" \
            --title "AAPS Build ${{ steps.prepare_assets.outputs.tag_name }}" \
            --notes "Automatischer Build vom Branch ${{ env.BUILD_BRANCH }} (Commit ${{ steps.prepare_assets.outputs.commit_sha }})"

#      # 2. Upload zu Nextcloud (Optionales Backup)
#      - name: Upload to Nextcloud
#        continue-on-error: true
#        run: |
#          FILE="${{ steps.prepare_assets.outputs.apk_path }}"
#          URL="${{ secrets.NEXTCLOUD_URL }}$FILE"
#
#          for i in 1 2 3 4 5; do
#            echo "Upload-Versuch $i"
#
#            if curl \
#              --fail \
#              --show-error \
#              --retry 3 \
#              --retry-all-errors \
#              --retry-delay 15 \
#              -u "${{ secrets.NEXTCLOUD_USER }}:${{ secrets.NEXTCLOUD_PASSWORD }}" \
#              -T "$FILE" "$URL"
#            then
#              echo "Upload erfolgreich"
#              exit 0
#            fi
#
#            echo "Warte 60 Sekunden wegen möglichem Nextcloud-Lock..."
#            sleep 60
#          done
#          echo "Upload nach mehreren Versuchen fehlgeschlagen"

  cleanup:
    runs-on: ubuntu-latest
    needs: [sync, build-release-upload]
    if: always() # Läuft auch bei Fehler, um aufzuräumen
    permissions:
      contents: write # WICHTIG: Erlaubt das Löschen von Releases
      actions: write
    steps:
      # 1. Alte Logs löschen
      - name: Delete Old Workflow Runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KEEP=5
          REPO="${GITHUB_REPOSITORY}"

          gh api \
            "repos/${REPO}/actions/runs?per_page=100" \
            --jq '.workflow_runs | sort_by(.created_at) | reverse | .['"$KEEP"':] | .[].id' \
          | while read RUNID; do
              [ -z "$RUNID" ] && continue

              echo "Deleting workflow run $RUNID"

              gh api \
                -X DELETE \
                "repos/${REPO}/actions/runs/${RUNID}"
            done

      # 2. Alte Releases (APKs) löschen
      - name: Delete Older Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KEEP=5
          REPO="${GITHUB_REPOSITORY}"

          gh release list \
            --repo "$REPO" \
            --limit 100 \
            --json tagName,publishedAt \
            --jq 'sort_by(.publishedAt) | reverse | .['"$KEEP"':] | .[].tagName' \
          | while read TAG; do
              [ -z "$TAG" ] && continue

              echo "Deleting release and tag $TAG"

              gh release delete "$TAG" \
                --repo "$REPO" \
                --cleanup-tag \
                --yes
            done
