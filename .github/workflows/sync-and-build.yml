name: Sync, Build & Upload to Nextcloud

on:
  schedule:
    - cron: '0 6,18 * * *' # Täglich um 06:00 und 18:00 Uhr
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Branch'
        required: true
        default: 'dev_OAPSAIMI'
        type: string

env:
  BUILD_BRANCH: ${{ inputs.branch_name || 'dev_OAPSAIMI' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.sync.outputs.has_changes }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_BRANCH }}
          fetch-depth: 0

      - name: Sync with Upstream
        id: sync
        run: |
          if [ "${{ env.BUILD_BRANCH }}" != "dev_OAPSAIMI" ]; then
            echo "Custom Branch. Kein Sync."
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git remote add upstream https://github.com/MTR93600/OpenApsAIMI.git
          git fetch upstream
          
          UPSTREAM_COMMIT=$(git rev-parse upstream/dev_OAPSAIMI)
          LOCAL_COMMIT=$(git rev-parse HEAD)
          
          if [ "$UPSTREAM_COMMIT" != "$LOCAL_COMMIT" ]; then
            echo "Updates found. Merging..."
            git merge upstream/dev_OAPSAIMI --allow-unrelated-histories
            git push origin dev_OAPSAIMI
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "No updates."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

  build-and-upload:
    needs: sync
    if: needs.sync.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04 # Exakt wie in android-build.yml
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_BRANCH }}
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21' #

      # Caching für schnelleren Build (aus android-build.yml übernommen)
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Keystore exakt wie in der funktionierenden Vorlage dekodieren
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > monkeystore.jks
        shell: bash

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Build-Schritt mit ENV-Variablen statt Parameter-Injection
      # Baut nur die Haupt-App (:app:assembleFullRelease), um Zeit zu sparen.
      - name: Build Release APK
        run: ./gradlew :app:assembleFullRelease
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/monkeystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        id: rename_apk
        run: |
          SRC_FILE="app/build/outputs/apk/full/release/app-full-release.apk"
          NEW_NAME="AAPS_Release_$(date +'%Y-%m-%d_%H-%M').apk"
          
          if [ -f "$SRC_FILE" ]; then
            mv "$SRC_FILE" "$NEW_NAME"
            echo "apk_path=$NEW_NAME" >> $GITHUB_OUTPUT
          else
            echo "Fehler: APK wurde nicht erstellt."
            exit 1
          fi

      - name: Upload to Nextcloud
        run: |
          curl -u "${{ secrets.NEXTCLOUD_USER }}:${{ secrets.NEXTCLOUD_PASSWORD }}" \
          -T "${{ steps.rename_apk.outputs.apk_path }}" \
          "${{ secrets.NEXTCLOUD_URL }}${{ steps.rename_apk.outputs.apk_path }}"
